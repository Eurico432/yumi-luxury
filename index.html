<script>
/* ===== SIMULADOR LOCAL ===== */
var localStorageDB = {
  get: function(tabela) { return JSON.parse(localStorage.getItem('yumi_' + tabela)) || []; },
  save: function(tabela, dados) { localStorage.setItem('yumi_' + tabela, JSON.stringify(dados)); }
};
var auth = {
  currentUser: null,
  onAuthStateChanged: function(cb) { var u = localStorage.getItem('yumi_logado'); if(u) { this.currentUser = JSON.parse(u); cb(this.currentUser); } else { cb(null); } },
  signInWithEmailAndPassword: function(email, senha) {
    var users = localStorageDB.get('usuarios');
    var user = users.find(function(u) { return u.email === email && u.senhaVisivel === senha; });
    if(user) { this.currentUser = user; localStorage.setItem('yumi_logado', JSON.stringify(user)); return Promise.resolve({ user: user }); }
    else { return Promise.reject({ code: 'auth/wrong-password' }); }
  },
  createUserWithEmailAndPassword: function(email, senha) {
    var users = localStorageDB.get('usuarios');
    if(users.find(function(u) { return u.email === email; })) return Promise.reject({ code: 'auth/email-already-in-use' });
    return Promise.resolve({ user: { uid: 'user_' + Date.now() } });
  },
  signOut: function() { localStorage.removeItem('yumi_logado'); this.currentUser = null; return Promise.resolve(); }
};
var db = {
  collection: function(tabela) {
    return {
      doc: function(id) {
        return {
          get: function() { var items = localStorageDB.get(tabela); var item = items.find(function(i) { return i.uid === id || i.id === id; }); return Promise.resolve({ exists: !!item, data: function() { return item; }, id: id }); },
          set: function(dados) { var items = localStorageDB.get(tabela); var index = items.findIndex(function(i) { return i.uid === id || i.id === id; }); dados.uid = id; if(index >= 0) items[index] = dados; else items.push(dados); localStorageDB.save(tabela, items); return Promise.resolve(); },
          update: function(dados) { var items = localStorageDB.get(tabela); var index = items.findIndex(function(i) { return i.uid === id || i.id === id; }); if(index >= 0) { Object.assign(items[index], dados); localStorageDB.save(tabela, items); } return Promise.resolve(); },
          delete: function() { var items = localStorageDB.get(tabela); items = items.filter(function(i) { return i.uid !== id && i.id !== id; }); localStorageDB.save(tabela, items); return Promise.resolve(); }
        };
      },
      add: function(dados) { var items = localStorageDB.get(tabela); dados.docId = 'doc_' + Date.now(); items.push(dados); localStorageDB.save(tabela, items); return Promise.resolve(); },
      get: function() { var items = localStorageDB.get(tabela); return Promise.resolve({ forEach: function(cb) { items.forEach(function(i) { cb({ id: i.docId || i.uid, data: function() { return i; } }); }); } }); },
      orderBy: function() { return this; }, limit: function() { return this; },
      where: function(campo, op, valor) { var items = localStorageDB.get(tabela); var filtrados = items.filter(function(i) { return i[campo] === valor; }); return { get: function() { return Promise.resolve({ size: filtrados.length, docs: filtrados.map(function(i) { return { id: i.docId || i.uid, data: function() { return i; } }; }) }); } }; }
    };
  }
};
var firebase = { firestore: { FieldValue: { serverTimestamp: function() { return new Date().toISOString(); } } } };

    var dados={ uid:uid, nome:nome, telefone:tel, email:emailInterno, senhaVisivel:senha, codigoConvite:codigoUnico, convidadoPor: codConvite || null, admin:isAdmin, bloqueado: false, tentativasLogin: 0, saldoKz:0, totalDepositadoKz:0, totalSacadoKz:0, totalBonus:0, ganhosHojeKz:0, planosAtivos:[], contasLevantamento: [], dataRegisto: new Date().toLocaleString('pt-BR') };
    return db.collection('usuarios').doc(uid).set(dados);
  }).then(function(){
    mostrarMsg('Conta criada! Faça login.','success');
    setTimeout(function(){trocarTelaAuth('login');},1500);
  }).catch(function(err){ mostrarMsg(err.code==='auth/email-already-in-use'?'Número já cadastrado.':'Erro ao criar conta.','error'); });
}

function fazerLogin(){
  var tel=normalizarTelefone(document.getElementById('l_tel').value);
  var senha=document.getElementById('l_pass').value;
  if(!tel||!senha){mostrarMsg('Preencha os dados.','error');return;}
  
  var users = localStorageDB.get('usuarios');
  var userExists = users.find(function(u) { return u.telefone === tel; });
  
  if(userExists && userExists.bloqueado) {
    mostrarMsg('Conta bloqueada por excesso de tentativas. Contacte o suporte.', 'error');
    return;
  }

  var emailInterno=tel+'@yumiluxury.app';
  
  auth.signInWithEmailAndPassword(emailInterno,senha).then(function(cred){
    return db.collection('usuarios').doc(cred.user.uid).get();
  }).then(function(doc){
    if(!doc.exists){ mostrarMsg('Perfil não encontrado.','error'); return; }
    var d=doc.data(); d.uid=doc.id;
    
    if(d.tentativasLogin > 0) {
      db.collection('usuarios').doc(d.uid).update({ tentativasLogin: 0 });
    }

    usuarioAtual=d; 
    document.getElementById('telaAuth').classList.add('hidden');
    document.getElementById('telaApp').classList.remove('hidden');
    document.getElementById('headerAvatar').innerText = d.nome.charAt(0).toUpperCase();
    document.getElementById('drawerNome').innerText = d.nome;
    document.getElementById('drawerTel').innerText = d.telefone;
    carregarTudo(function(){ mudarTab('inicio'); setTimeout(mostrarPopupWhatsApp, 3000); });
    
  }).catch(function(err){ 
    if(userExists) {
      var novasTentativas = (userExists.tentativasLogin || 0) + 1;
      if(novasTentativas >= 3) {
        db.collection('usuarios').doc(userExists.uid).update({ tentativasLogin: novasTentativas, bloqueado: true });
        mostrarMsg('Conta bloqueada após 3 tentativas. Contacte o suporte.', 'error');
      } else {
        db.collection('usuarios').doc(userExists.uid).update({ tentativasLogin: novasTentativas });
        mostrarMsg('Senha incorreta. Tentativa ' + novasTentativas + ' de 3.', 'error');
      }
    } else {
      mostrarMsg('Número ou senha incorretos.', 'error');
    }
  });
}

function sair(){ auth.signOut().then(function(){ usuarioAtual=null; document.getElementById('telaApp').classList.add('hidden'); document.getElementById('telaAuth').classList.remove('hidden'); }); }
function trocarTelaAuth(t){ if(t==='cadastro'){ document.getElementById('divLogin').classList.add('hidden'); document.getElementById('divCadastro').classList.remove('hidden'); } else { document.getElementById('divCadastro').classList.add('hidden'); document.getElementById('divLogin').classList.remove('hidden'); } }

function enviarSaque(){
  var valor = parseFloat(document.getElementById('saq_valor').value);
  var contaIdx = parseInt(document.getElementById('saq_conta_idx').value);
  
  if(!valor || valor < CONFIG.minSaque) { alert('Valor mínimo: ' + formatKz(CONFIG.minSaque)); return; }
  if(valor > (usuarioAtual.saldoKz || 0)) { alert('Saldo insuficiente.'); return; }
  
  var contaEscolhida = usuarioAtual.contasLevantamento[contaIdx];
  var taxa = valor * CONFIG.taxaSaque;
  var liquido = valor - taxa;
  var dataHora = new Date().toLocaleString('pt-BR');

  if(!confirm('Confirmar saque de ' + formatKz(valor) + '?\nLíquido: ' + formatKz(liquido) + '\nDestino: ' + contaEscolhida.conta)) return;

  var novoSaldo = usuarioAtual.saldoKz - valor;
  db.collection('usuarios').doc(usuarioAtual.uid).update({ saldoKz: novoSaldo }).then(function(){
    usuarioAtual.saldoKz = novoSaldo;
    return db.collection('saques').add({ 
      userId: usuarioAtual.uid, userNome: usuarioAtual.nome, valor: valor, 
      taxa: taxa, liquido: liquido, 
      metodo: contaEscolhida.tipo, 
      conta: contaEscolhida.conta, 
      banco: contaEscolhida.banco || '', 
      entidade: contaEscolhida.entidade || '',
      nomeDestino: contaEscolhida.nome || usuarioAtual.nome,
      dataHora: dataHora, status: 'pendente' 
    });
  }).then(function(){ 
    alert('✅ Saque enviado com sucesso!\nAguarde a aprovação do administrador.'); 
    carregarTudo(function(){ mudarTab('inicio'); }); 
  });
}

  var tipo = document.getElementById('nova_conta_tipo').value;

  var novaConta = { tipo: tipo, nome: nome };

  if(!nome) { alert('Preencha o nome do titular.'); return; }

  if(tipo === 'IBAN') {
    var iban = document.getElementById('nova_iban_num').value.trim();
    var banco = document.getElementById('nova_iban_banco').value.trim();
    if(!iban || !banco) { alert('Preencha os dados do IBAN.'); return; }

/* ===== SALDO DIÁRIO ===== */
function renderSaldoDiario() {
  var u = usuarioAtual;
  var hojeStr = new Date().toLocaleDateString('pt-BR');
  var depsHoje = depositos.filter(function(d){ return d.userId === u.uid && d.status === 'aprovado' && d.data.indexOf(hojeStr) > -1; });
  var saqsHoje = saques.filter(function(s){ return s.userId === u.uid && s.status === 'pago' && s.dataHora.indexOf(hojeStr) > -1; });
  
  var totalDep = depsHoje.reduce(function(acc, d){ return acc + d.valorOriginal; }, 0);
  var totalSaq = saqsHoje.reduce(function(acc, s){ return acc + s.valor; }, 0);
  var creditos = u.ganhosHojeKz || 0;
  var saldoInicial = (u.saldoKz || 0) - totalDep + totalSaq - creditos;
  var saldoFinal = u.saldoKz || 0;

  var h = `<div style="padding: 0 15px;">
    <h2 style="font-size:16px;color:var(--dourado);margin-bottom:15px;">Saldo Diário (${hojeStr})</h2>
    <div style="background:var(--bg-card);border-radius:15px;padding:15px;border:1px solid var(--dourado);margin-bottom:15px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:8px;"><span style="color:var(--texto-mut);">Saldo Inicial</span><b style="color:#FFF;">${formatKz(saldoInicial)}</b></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:8px;"><span style="color:var(--texto-mut);">Depósitos Confirmados</span><b class="text-verde">+${formatKz(totalDep)}</b></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:8px;"><span style="color:var(--texto-mut);">Levantamentos</span><b class="text-vermelho">-${formatKz(totalSaq)}</b></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:8px;"><span style="color:var(--texto-mut);">Créditos/Rendas</span><b class="text-verde">+${formatKz(creditos)}</b></div>
      <div style="display:flex;justify-content:space-between;background:var(--azul-marinho);padding:10px;border-radius:8px;font-size:13px;margin-top:10px;"><span style="color:var(--dourado-claro);font-weight:800;">Saldo Final</span><b class="text-dourado">${formatKz(saldoFinal)}</b></div>
    </div>
    <h3 style="font-size:13px;color:var(--texto-branco);margin-bottom:10px;">Histórico de Movimentos</h3>
    <div style="display:flex;flex-direction:column;gap:8px;">`;

  var todosDeps = depositos.filter(function(d){ return d.userId === u.uid; });
  var todosSaqs = saques.filter(function(s){ return s.userId === u.uid; });
  
  if(todosDeps.length === 0 && todosSaqs.length === 0) {
    h += `<p style="font-size:11px;color:var(--texto-mut);text-align:center;">Nenhum movimento recente.</p>`;
  } else {
    var movs = [];
    todosDeps.forEach(function(d){ movs.push({data: d.data, tipo: 'Depósito', valor: d.valorOriginal, sinal: '+', status: d.status}); });
    todosSaqs.forEach(function(s){ movs.push({data: s.dataHora, tipo: 'Saque', valor: s.valor, sinal: '-', status: s.status}); });
    movs.sort(function(a,b){ return new Date(b.data) - new Date(a.data); });
    
    movs.slice(0, 15).forEach(function(m){
      var corStatus = m.status === 'aprovado' || m.status === 'pago' ? 'var(--verde)' : (m.status === 'rejeitado' ? 'var(--vermelho)' : 'var(--dourado)');
      h += `<div style="background:var(--bg-card);padding:10px;border-radius:8px;display:flex;justify-content:space-between;font-size:11px;border-left:3px solid ${corStatus};">
        <div><span>${m.data} - ${m.tipo}</span><br><small style="color:${corStatus};text-transform:uppercase;">${m.status}</small></div>
        <b class="${m.sinal === '+' ? 'text-verde' : 'text-vermelho'}">${m.sinal} ${formatKz(m.valor)}</b>
      </div>`;
    });
  }
  h += `</div></div>`;
  return h;
}

function filtrarAdminUsers() {
  var query = document.getElementById('adminSearch').value.toLowerCase();
  var list = document.getElementById('adminUserList');
  if(!list) return;
  var filtered = usuarios.filter(function(u) {
    return (u.nome || '').toLowerCase().includes(query) || (u.telefone || '').includes(query) || (u.uid || '').toLowerCase().includes(query);
  });
  if(filtered.length === 0) { list.innerHTML = '<p style="font-size:11px;color:var(--texto-mut);">Nenhum utilizador encontrado.</p>'; return; }

/* ===== AÇÕES DE APROVAÇÃO/REJEIÇÃO/ELIMINAR ===== */
function adminAprovarDep(docId) {
  var d = depositos.find(function(x){ return x.docId === docId; });
  if(!d) return;
  var u = usuarios.find(function(x){ return x.uid === d.userId; });
  if(!u) return;

  var novoSaldo = (u.saldoKz || 0) + d.valorOriginal;
  var novoTotal = (u.totalDepositadoKz || 0) + d.valorOriginal;

  db.collection('depositos').doc(docId).update({ status: 'aprovado' }).then(function(){
    return db.collection('usuarios').doc(u.uid).update({ saldoKz: novoSaldo, totalDepositadoKz: novoTotal });
  }).then(function(){
    if(u.convidadoPor) {
      var patrocinador = usuarios.find(function(x){ return x.codigoConvite === u.convidadoPor; });
      if(patrocinador) {
        var bonus = d.valorOriginal * 0.03;
        db.collection('usuarios').doc(patrocinador.uid).update({ 
          saldoKz: (patrocinador.saldoKz || 0) + bonus,
          totalBonus: (patrocinador.totalBonus || 0) + bonus
        });
      }
    }
    alert('✅ Depósito aprovado e saldo creditado!');
    depositos = depositos.filter(function(x) { return x.docId !== docId; });
    adminTab('depositos');
  });
}

function adminRejeitarDep(docId) {
  db.collection('depositos').doc(docId).update({ status: 'rejeitado' }).then(function(){
    alert('❌ Depósito rejeitado.');
    depositos = depositos.filter(function(x) { return x.docId !== docId; });
    adminTab('depositos');
  });
}

function adminEliminarDep(docId) {
  if(!confirm('⚠️ Tem a certeza que deseja eliminar permanentemente este depósito do sistema?')) return;
  db.collection('depositos').doc(docId).delete().then(function(){
    alert('🗑️ Depósito eliminado permanentemente.');
    depositos = depositos.filter(function(x) { return x.docId !== docId; });
    adminTab('depositos');
  });
}

/* ===== ADMIN: CREDITAR RENDAS ===== */
function adminCreditarTodos(isAuto) {
  if(!isAuto && !confirm('Deseja creditar as rendas de 7.5% para todos os utilizadores com planos ativos?')) return;
  var promessas = [];
  usuarios.forEach(function(u) {
    var planos = u.planosAtivos || [];
    if(planos.length === 0) return;
    var totalCredito = 0; var alterou = false;
    planos.forEach(function(p) {
      var ultimo = p.ultimoCredito || p.dataInicio_timestamp || (Date.now() - 24*60*60*1000);
      var dias = Math.floor((Date.now() - ultimo) / (24*60*60*1000));
      if(dias > 0) {
        totalCredito += p.diario * dias;
        p.ganhoTotal = (p.ganhoTotal || 0) + (p.diario * dias);
        p.ultimoCredito = Date.now();
        alterou = true;
      }
    });
    if(alterou) {
      var novoSaldo = (u.saldoKz || 0) + totalCredito;
      promessas.push(db.collection('usuarios').doc(u.uid).update({ saldoKz: novoSaldo, ganhosHojeKz: (u.ganhosHojeKz || 0) + totalCredito, planosAtivos: planos }));
    }
  });
  Promise.all(promessas).then(function() {
    if(!isAuto) alert('✅ Rendas creditadas com sucesso!');
    carregarTudo(function(){ if(!isAuto) adminTab('creditar'); });
  });
}

/* ===== RENDAS AUTOMÁTICAS ÀS 04H00 ===== */
function verificarHoraCredito() {
  var agora = new Date();
  var hora = agora.getHours();
  var hojeStr = agora.toLocaleDateString('pt-BR');
  var ultimaExecucao = localStorage.getItem('yumi_ultima_renda_auto');

  if (hora >= 4 && ultimaExecucao !== hojeStr) {
    console.log('⏰ A iniciar crédito automático de rendas...');
    adminCreditarTodos(true);
    localStorage.setItem('yumi_ultima_renda_auto', hojeStr);
  }
}
