    var isAdmin = (tel === ADMIN_TELEFONE);
    var codigoUnico = 'YM' + Math.floor(100000 + Math.random() * 900000);
    
    var dados = { 
      uid: uid, nome: nome, telefone: tel, email: emailInterno, senhaVisivel: senha, 
      codigoConvite: codigoUnico, linkConvite: gerarLink(codigoUnico), 
      convidadoPor: codConvite || null, admin: isAdmin, bloqueado: false, 
      tentativasLogin: 0, saldoKz: 1500, totalDepositadoKz: 0, totalSacadoKz: 0, 
      totalBonus: 1500, ganhosHojeKz: 0, planosAtivos: [], contasLevantamento: [], 
      dataRegisto: new Date().toLocaleString('pt-BR') 
    };
    
    return db.collection('usuarios').doc(uid).set(dados);
  }).then(function(){
    mostrarMsg('Conta criada com 1500 Kz de bónus! Faça login.','success');
    setTimeout(function(){trocarTelaAuth('login');},2000);
  }).catch(function(err){ 
    console.error(err);
    if(err.code === 'auth/email-already-in-use') mostrarMsg('Número já cadastrado.','error');
    else mostrarMsg('Erro ao criar conta. Tente novamente.','error'); 
  });
}

function fazerLogin(){
  var tel=normalizarTelefone(document.getElementById('l_tel').value);
  var senha=document.getElementById('l_pass').value;
  if(!tel||!senha){mostrarMsg('Preencha os dados.','error');return;}
  
  var emailInterno=tel+'@yumiluxury.app';
  
  auth.signInWithEmailAndPassword(emailInterno, senha).then(function(cred){
    return db.collection('usuarios').doc(cred.user.uid).get();
  }).then(function(doc){
    if(!doc.exists){ mostrarMsg('Perfil não encontrado.', 'error'); auth.signOut(); return; }
    var d = doc.data(); d.uid = doc.id;
    
    if(d.bloqueado) {
      mostrarMsg('Conta bloqueada. Contacte o suporte.', 'error');
      auth.signOut();
      return;
    }

    if(d.tentativasLogin > 0) {
      db.collection('usuarios').doc(d.uid).update({ tentativasLogin: 0 });
    }

    usuarioAtual=d; 
    document.getElementById('telaAuth').classList.add('hidden');
    document.getElementById('telaApp').classList.remove('hidden');
    document.getElementById('headerAvatar').innerText = d.nome.charAt(0).toUpperCase();
    document.getElementById('drawerNome').innerText = d.nome;
    document.getElementById('drawerTel').innerText = d.telefone;
    
    carregarTudo(function(){ 
      carregarLinkWhatsApp(function() {
        mudarTab('inicio'); 
        sessionStorage.removeItem('whatsappPopupVisto');
        setTimeout(mostrarPopupWhatsApp, 1500); 
      });
    });
    
  }).catch(function(err){ 
    console.error(err);
    if(err.code === 'auth/user-not-found') mostrarMsg('Número não cadastrado.', 'error');
    else if(err.code === 'auth/wrong-password') mostrarMsg('Senha incorreta.', 'error');
    else mostrarMsg('Erro ao verificar conta.', 'error');
  });
}

function sair(){ 
  auth.signOut().then(function(){ 
    usuarioAtual=null; 
    document.getElementById('telaApp').classList.add('hidden'); 
    document.getElementById('telaAuth').classList.remove('hidden'); 
  }); 
}

function trocarTelaAuth(t){ 
  if(t==='cadastro'){ document.getElementById('divLogin').classList.add('hidden'); document.getElementById('divCadastro').classList.remove('hidden'); } 
  else { document.getElementById('divCadastro').classList.add('hidden'); document.getElementById('divLogin').classList.remove('hidden'); } 
}

function mudarTab(tab) {
  var items = document.querySelectorAll('.nav-item'); 
  items.forEach(function(i) { i.classList.remove('active'); });
  var c = document.getElementById('conteudoApp');
  
  if(tab === 'inicio') { c.innerHTML = renderInicio(); items[0].classList.add('active'); }
  else if(tab === 'depositar') { c.innerHTML = renderDepositar(); items[1].classList.add('active'); }
  else if(tab === 'sacar') { c.innerHTML = renderSacar(); items[2].classList.add('active'); }
  else if(tab === 'equipa') { c.innerHTML = renderEquipa(); items[3].classList.add('active'); }
  else if(tab === 'bonus') { c.innerHTML = renderBonus(); items[4].classList.add('active'); }
  else if(tab === 'mais') { c.innerHTML = renderMais(); items[5].classList.add('active'); }
  else if(tab === 'perfil') { c.innerHTML = renderPerfil(); }
  else if(tab === 'investir') { c.innerHTML = renderInvestir(); }
  else if(tab === 'saldoDiario') { c.innerHTML = renderSaldoDiario(); }
  else if(tab === 'historico') { c.innerHTML = renderHistorico(); }
  else if(tab === 'seguranca') { c.innerHTML = renderSeguranca(); }
  else if(tab === 'suporte') { c.innerHTML = renderSuporte(); }
  else if(tab === 'contas') { c.innerHTML = renderContas(); }
  else if(tab === 'niveis') { c.innerHTML = renderNiveis(); }
  
  window.scrollTo(0,0);

function investir(nome, valor, diario){
  if((usuarioAtual.saldoKz || 0) < valor) return;
  var planos = usuarioAtual.planosAtivos || [];
  planos.push({ nome: nome, valor: valor, diario: diario, dataInicio: new Date().toLocaleDateString('pt-BR'), ultimoCredito: Date.now(), ganhoTotal: 0 });
  var novoSaldo = usuarioAtual.saldoKz - valor;
  db.collection('usuarios').doc(usuarioAtual.uid).update({ saldoKz: novoSaldo, planosAtivos: planos }).then(function(){
    usuarioAtual.saldoKz = novoSaldo; usuarioAtual.planosAtivos = planos;
    alert('✅ Plano ativado com sucesso!'); mudarTab('inicio');
  });
}

function enviarDeposito(){

  if(!fileInput.files[0]) { alert('O comprovativo é obrigatório.'); return; }

  var reader = new FileReader();
  reader.onload = function(e) {
    var base64Image = e.target.result;
    db.collection('depositos').add({
      userId: usuarioAtual.uid, userNome: usuarioAtual.nome, valorOriginal: valor,
      conta: conta, comprovativo: base64Image, data: new Date().toLocaleString('pt-BR'), status: 'pendente'
    }).then(function(){
      alert('✅ Depósito enviado com sucesso!\nAguarde a aprovação do administrador.');
      carregarTudo(function(){ mudarTab('inicio'); });
    }).catch(function(err){
      alert('Erro ao enviar depósito. Verifique a sua ligação à internet.');

function renderSacar(){
  var contas = usuarioAtual.contasLevantamento || [];
  var temInvestimentoAtivo = (usuarioAtual.planosAtivos || []).length > 0;

  var h = `<div style="padding: 0 15px;"><h2 style="font-size:16px;margin-bottom:15px;color:var(--dourado);">Solicitar Levantamento</h2><div style="background:rgba(212,175,55,0.1);border:1px solid var(--dourado);border-radius:10px;padding:10px;margin-bottom:15px;font-size:11px;color:var(--dourado-claro);">${CONFIG.horarioSaque} | Taxa: ${CONFIG.taxaSaque*100}% | Mínimo: ${formatKz(CONFIG.minSaque)}</div>`;

  if(!temInvestimentoAtivo) {
    h += `<div style="background:rgba(239,68,68,0.1);border:1px solid var(--vermelho);padding:20px;border-radius:12px;text-align:center;margin-bottom:15px;"><i class="fa-solid fa-lock" style="font-size:30px;color:var(--vermelho);margin-bottom:10px;"></i><p style="font-size:12px;color:#FFF;">Para realizar levantamentos, precisa de ter pelo menos um <b>Plano de Investimento Ativo</b>.</p><button class="btn-primary" style="margin-top:15px;" onclick="mudarTab('investir')">Ver Planos de Investimento</button></div></div>`;
    return h;
  }

  if(contas.length === 0) {
    h += `<div style="background:var(--bg-card);padding:20px;border-radius:12px;text-align:center;margin-bottom:15px;"><i class="fa-solid fa-triangle-exclamation" style="font-size:30px;color:var(--dourado);margin-bottom:10px;"></i><p style="font-size:12px;color:#FFF;">Para levantar, vincule pelo menos uma conta.</p><button class="btn-primary" style="margin-top:15px;" onclick="mudarTab('contas')">Vincular Contas Agora</button></div></div>`;
    return h;
  }

  var opcoes = contas.map(function(c, index){
    var label = c.tipo === 'IBAN' ? 'IBAN: ' + c.conta + ' (' + c.banco + ')' : 'Ref: ' + c.entidade + ' / ' + c.conta + ' (' + c.nome + ')';
    return `<option value="${index}">${label}</option>`;
  }).join('');

  h += `<div class="form-group"><label>Valor a Levantar (Kz)</label><input type="number" id="saq_valor" placeholder="Ex: 2000" style="background:#000;border:1px solid var(--dourado);color:#FFF;padding:12px;width:100%;border-radius:8px;"></div>
    <div class="form-group"><label>Escolha a Conta de Destino</label><select id="saq_conta_idx" style="background:#000;border:1px solid var(--dourado);color:#FFF;padding:12px;width:100%;border-radius:8px;">${opcoes}</select></div>
    <button class="btn-primary" onclick="enviarSaque()">SOLICITAR SAQUE</button></div>`;
  return h;
}

function enviarSaque(){
  var valor = parseFloat(document.getElementById('saq_valor').value);
  var contaIdx = parseInt(document.getElementById('saq_conta_idx').value);
  
  if(!valor || valor < CONFIG.minSaque) { alert('Valor mínimo: ' + formatKz(CONFIG.minSaque)); return; }
  if(valor > (usuarioAtual.saldoKz || 0)) { alert('Saldo insuficiente.'); return; }
  
  var contaEscolhida = usuarioAtual.contasLevantamento[contaIdx];
  var taxa = valor * CONFIG.taxaSaque;
  var liquido = valor - taxa;
  var dataHora = new Date().toLocaleString('pt-BR');

  if(!confirm('Confirmar saque de ' + formatKz(valor) + '?\nLíquido: ' + formatKz(liquido) + '\nDestino: ' + contaEscolhida.conta)) return;

  var novoSaldo = usuarioAtual.saldoKz - valor;
  db.collection('usuarios').doc(usuarioAtual.uid).update({ saldoKz: novoSaldo }).then(function(){
    usuarioAtual.saldoKz = novoSaldo;
    return db.collection('saques').add({ 
      userId: usuarioAtual.uid, userNome: usuarioAtual.nome, valor: valor, 
      taxa: taxa, liquido: liquido, 
      metodo: contaEscolhida.tipo, 
      conta: contaEscolhida.conta, 
      banco: contaEscolhida.banco || '', 
      entidade: contaEscolhida.entidade || '',
      nomeDestino: contaEscolhida.nome || usuarioAtual.nome,
      dataHora: dataHora, status: 'pendente' 
    });
  }).then(function(){ 
    alert('✅ Saque enviado com sucesso!\nAguarde a aprovação do administrador.'); 
    carregarTudo(function(){ mudarTab('inicio'); }); 
  }).catch(function(err){
    alert('Erro ao processar saque.');
  });
}

    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">`;

  if(contas.length === 0) h += `<p style="font-size:11px;color:var(--texto-mut);">Nenhuma conta vinculada.</p>`;
  else {
    contas.forEach(function(c, idx){
      h += `<div style="background:var(--bg-card);padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:11px;color:#FFF;">
          <b>${c.tipo}</b><br>
          ${c.tipo === 'IBAN' ? `IBAN: ${c.conta}<br>Banco: ${c.banco}` : `Entidade: ${c.entidade}<br>Ref: ${c.conta}`}<br>
          Nome: ${c.nome}
        </div>
        <span style="font-size:10px;color:var(--verde);font-weight:bold;">🔒 Fixa</span>
      </div>`;
    });
  }
  
  h += `</div>`;
  
  if (contas.length < 3) {
    h += `
    <h3 style="font-size:14px;color:var(--dourado);margin-bottom:10px;">Adicionar Nova Conta (${contas.length}/3)</h3>
    <div style="background:var(--bg-card);padding:15px;border-radius:12px;margin-bottom:15px;">
      <div class="form-group"><label>Tipo de Conta</label><select id="nova_conta_tipo" style="background:#000;border:1px solid var(--dourado);color:#FFF;padding:10px;width:100%;border-radius:8px;"><option value="IBAN">Conta Bancária (IBAN)</option><option value="Referência">Conta de Referência (Unitel/PayPay)</option></select></div>
      <div id="campos_iban">
        <div class="form-group"><input type="text" id="nova_iban_num" placeholder="Número do IBAN" style="background:#000;border:1px solid var(--dourado);color:#FFF;padding:10px;width:100%;border-radius:8px;margin-bottom:5px;"></div>
        <div class="form-group"><input type="text" id="nova_iban_banco" placeholder="Nome do Banco" style="background:#000;border:1px solid var(--dourado);color:#FFF;padding:10px;width:100%;border-radius:8px;margin-bottom:5px;"></div>
      </div>
      <div id="campos_ref" class="hidden">
        <div class="form-group"><input type="text" id="nova_ref_ent" placeholder="Entidade (ex: 00930)" style="background:#000;border:1px solid var(--dourado);color:#FFF;padding:10px;width:100%;border-radius:8px;margin-bottom:5px;"></div>
        <div class="form-group"><input type="text" id="nova_ref_num" placeholder="Número de Telefone/Referência" style="background:#000;border:1px solid var(--dourado);color:#FFF;padding:10px;width:100%;border-radius:8px;margin-bottom:5px;"></div>
      </div>
      <div class="form-group"><input type="text" id="nova_conta_nome" placeholder="Nome do Titular/Destinatário" style="background:#000;border:1px solid var(--dourado);color:#FFF;padding:10px;width:100%;border-radius:8px;"></div>
      <button class="btn-primary" onclick="adicionarConta()">ADICIONAR CONTA FIXA</button>
    </div>`;
  } else {
    h += `<div style="background:rgba(239,68,68,0.1); border:1px solid var(--vermelho); padding:15px; border-radius:10px; text-align:center; font-size:11px; color:#FFF;">Limite de 3 contas atingido. Para alterar, contacte o administrador.</div>`;
  }

  h += `</div>`;
  
  setTimeout(function() {
    var sel = document.getElementById('nova_conta_tipo');
    if(sel) sel.onchange = function() {
      document.getElementById('campos_iban').classList.toggle('hidden', this.value !== 'IBAN');
      document.getElementById('campos_ref').classList.toggle('hidden', this.value === 'IBAN');
    };
  }, 100);

  return h;
}

function adicionarConta(){
  var contas = usuarioAtual.contasLevantamento || [];
  if (contas.length >= 3) { alert('Limite de 3 contas atingido.'); return; }

  var tipo = document.getElementById('nova_conta_tipo').value;
  var nome = document.getElementById('nova_conta_nome').value.trim();
  var novaConta = { tipo: tipo, nome: nome };

  if(!nome) { alert('Preencha o nome do titular.'); return; }

  if(tipo === 'IBAN') {
    var iban = document.getElementById('nova_iban_num').value.trim();
    var banco = document.getElementById('nova_iban_banco').value.trim();
    if(!iban || !banco) { alert('Preencha os dados do IBAN.'); return; }
    novaConta.conta = iban; novaConta.banco = banco;
  } else {
    var ent = document.getElementById('nova_ref_ent').value.trim();
    var num = document.getElementById('nova_ref_num').value.trim();
    if(!ent || !num) { alert('Preencha os dados da referência.'); return; }
    novaConta.conta = num; novaConta.entidade = ent;
  }

  if(!confirm('⚠️ Atenção: Após adicionar, esta conta ficará FIXA e não poderá ser alterada ou eliminada. Confirmar?')) return;

  contas.push(novaConta);
  db.collection('usuarios').doc(usuarioAtual.uid).update({ contasLevantamento: contas }).then(function(){
    usuarioAtual.contasLevantamento = contas;
    alert('✅ Conta adicionada com sucesso e bloqueada!');
    mudarTab('contas');
  });
}

/* ===== SALDO DIÁRIO E HISTÓRICO ===== */
function renderSaldoDiario() {
  var u = usuarioAtual;
  var hojeStr = new Date().toLocaleDateString('pt-BR');
  
  var todosDeps = depositos.filter(function(d){ return d.userId === u.uid; });
  var todosSaqs = saques.filter(function(s){ return s.userId === u.uid; });
  
  var totalDepConfirmados = todosDeps.filter(function(d){ return d.status === 'aprovado'; }).reduce(function(acc, d){ return acc + d.valorOriginal; }, 0);
  var totalSaqAprovados = todosSaqs.filter(function(s){ return s.status === 'pago'; }).reduce(function(acc, s){ return acc + s.valor; }, 0);
  
  var totalInvestido = 0;
  if(u.planosAtivos) u.planosAtivos.forEach(function(p){ totalInvestido += p.valor; });
  
  var rendasTotais = u.ganhosHojeKz || 0;

  var h = `<div style="padding: 0 15px;"><h2 style="font-size:16px;color:var(--dourado);margin-bottom:15px;">Resumo de Movimentos (Geral)</h2>
    <div style="background:var(--bg-card);border-radius:15px;padding:15px;border:1px solid var(--dourado);margin-bottom:15px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:8px;"><span style="color:var(--texto-mut);">Total Depósitos Confirmados</span><b class="text-verde">+${formatKz(totalDepConfirmados)}</b></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:8px;"><span style="color:var(--texto-mut);">Total de Levantamentos Aprovados</span><b class="text-vermelho">-${formatKz(totalSaqAprovados)}</b></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:8px;"><span style="color:var(--texto-mut);">Total em Investimentos Ativos</span><b style="color:var(--dourado);">${formatKz(totalInvestido)}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;"><span style="color:var(--texto-mut);">Total de Rendas Recebidas</span><b class="text-verde">+${formatKz(rendasTotais)}</b></div>
    </div>
    
    <h3 style="font-size:14px;color:#FFF;margin-bottom:10px;">Histórico de Movimentos</h3>
    <div style="display:flex;flex-direction:column;gap:8px;">`;

  if(todosDeps.length === 0 && todosSaqs.length === 0) {
    h += `<p style="font-size:11px;color:var(--texto-mut);text-align:center;">Nenhum movimento registado.</p>`;
  } else {
    var movs = [];
    todosDeps.forEach(function(d){ movs.push({data: d.data, tipo: 'Depósito', valor: d.valorOriginal, sinal: '+', status: d.status}); });
    todosSaqs.forEach(function(s){ movs.push({data: s.dataHora, tipo: 'Saque', valor: s.valor, sinal: '-', status: s.status}); });
    movs.sort(function(a,b){ return new Date(b.data) - new Date(a.data); });
    movs.forEach(function(m){
      var corStatus = m.status === 'aprovado' || m.status === 'pago' ? 'var(--verde)' : (m.status === 'rejeitado' ? 'var(--vermelho)' : 'var(--dourado)');
      h += `<div style="background:var(--bg-card);padding:10px;border-radius:8px;display:flex;justify-content:space-between;font-size:11px;border-left:3px solid ${corStatus};"><div><span>${m.data} - ${m.tipo}</span><br><small style="color:${corStatus};text-transform:uppercase;font-weight:bold;">${m.status}</small></div><b class="${m.sinal === '+' ? 'text-verde' : 'text-vermelho'}">${m.sinal} ${formatKz(m.valor)}</b></div>`;
    });
  }
  h += `</div></div>`;
  return h;
}

function renderHistorico() {
  var u = usuarioAtual;
  var deps = depositos.filter(function(d){ return d.userId === u.uid; });
  var saqs = saques.filter(function(s){ return s.userId === u.uid; });
  var h = `<div style="padding: 0 15px;"><h2 style="font-size:16px;color:var(--dourado);margin-bottom:15px;">Histórico de Transações</h2>`;
  
  if(deps.length === 0 && saqs.length === 0) h += `<p style="color:var(--texto-mut);font-size:12px;">Nenhuma transação.</p>`;
  
  if(deps.length > 0) {
    h += `<h3 style="font-size:12px;color:var(--texto-mut);margin-bottom:8px;">DEPÓSITOS</h3>`;
    deps.sort(function(a,b){ return new Date(b.data) - new Date(a.data); }).forEach(function(d){ 
      var cor = d.status === 'aprovado' ? 'var(--verde)' : (d.status === 'rejeitado' ? 'var(--vermelho)' : 'var(--dourado)'); 
      h += `<div style="background:var(--bg-card);padding:12px;border-radius:8px;margin-bottom:8px;border-left:3px solid ${cor};"><div style="font-size:12px;font-weight:800;">Depósito: ${formatKz(d.valorOriginal)}</div><div style="font-size:10px;color:${cor};font-weight:800;">${d.status.toUpperCase()}</div><div style="font-size:10px;color:var(--texto-mut);">${d.data}</div></div>`; 
    });
  }
  
  if(saqs.length > 0) {
    h += `<h3 style="font-size:12px;color:var(--texto-mut);margin-bottom:8px;margin-top:15px;">SAQUES</h3>`;
    saqs.sort(function(a,b){ return new Date(b.dataHora) - new Date(a.dataHora); }).forEach(function(s){ 
      var cor = s.status === 'pago' ? 'var(--verde)' : (s.status === 'rejeitado' ? 'var(--vermelho)' : 'var(--dourado)'); 
      h += `<div style="background:var(--bg-card);padding:12px;border-radius:8px;margin-bottom:8px;border-left:3px solid ${cor};"><div style="font-size:12px;font-weight:800;">Saque: ${formatKz(s.valor)}</div><div style="font-size:10px;color:${cor};font-weight:800;">${s.status.toUpperCase()}</div><div style="font-size:10px;color:var(--texto-mut);">${s.dataHora}</div></div>`; 
    });
  }
  h += `</div>`;
  return h;
}

function adminAprovarDep(docId) {
  var d = depositos.find(function(x){ return x.docId === docId; });
  if(!d) { alert('Depósito não encontrado.'); return; }
  var u = usuarios.find(function(x){ return x.uid === d.userId; });
  if(!u) { alert('Utilizador não encontrado.'); return; }

  var novoSaldo = (u.saldoKz || 0) + d.valorOriginal;
  var novoTotal = (u.totalDepositadoKz || 0) + d.valorOriginal;

  db.collection('depositos').doc(docId).update({ status: 'aprovado' }).then(function(){
    return db.collection('usuarios').doc(u.uid).update({ saldoKz: novoSaldo, totalDepositadoKz: novoTotal });
  }).then(function(){
    if(u.convidadoPor) {
      var patrocinador = usuarios.find(function(x){ return x.codigoConvite === u.convidadoPor; });
      if(patrocinador) {
        var bonus = d.valorOriginal * 0.03;
        db.collection('usuarios').doc(patrocinador.uid).update({ 
          saldoKz: (patrocinador.saldoKz || 0) + bonus,
          totalBonus: (patrocinador.totalBonus || 0) + bonus
        });
      }
    }
    depositos = depositos.filter(function(x) { return x.docId !== docId; });
    alert('✅ Depósito aprovado e saldo creditado!');
    adminTab('depositos');
  });
}

function adminRejeitarDep(docId) {
  if(!confirm('Tem a certeza que deseja rejeitar este depósito?')) return;
  db.collection('depositos').doc(docId).update({ status: 'rejeitado' }).then(function(){
    depositos = depositos.filter(function(x) { return x.docId !== docId; });
    alert('❌ Depósito rejeitado (continua no histórico do utilizador).');
    adminTab('depositos');
  });
}

/* ===== ADMIN: APROVAR / REJEITAR SAQUES ===== */
function adminAprovarSaq(docId) {
  var s = saques.find(function(x){ return x.docId === docId; });
  if(!s) { alert('Saque não encontrado.'); return; }
  var u = usuarios.find(function(x){ return x.uid === s.userId; });
  
  db.collection('saques').doc(docId).update({ status: 'pago' }).then(function(){
    if(u) db.collection('usuarios').doc(u.uid).update({ totalSacadoKz: (u.totalSacadoKz || 0) + s.valor });
    saques = saques.filter(function(x) { return x.docId !== docId; });
    alert('✅ Saque pago!');
    adminTab('saques');
  });
}

function adminRejeitarSaq(docId) {
  var s = saques.find(function(x){ return x.docId === docId; });
  if(!s) { alert('Saque não encontrado.'); return; }
  var u = usuarios.find(function(x){ return x.uid === s.userId; });
  if(!u) { alert('Utilizador não encontrado.'); return; }

  var novoSaldo = (u.saldoKz || 0) + s.valor;

  db.collection('saques').doc(docId).update({ status: 'rejeitado' }).then(function(){
    return db.collection('usuarios').doc(u.uid).update({ saldoKz: novoSaldo });
  }).then(function(){
    saques = saques.filter(function(x) { return x.docId !== docId; });
    alert('❌ Saque rejeitado, saldo devolvido (continua no histórico do utilizador).');
    adminTab('saques');
  });
}

function filtrarAdminUsers() {
  var query = document.getElementById('adminSearch').value.toLowerCase();
  var list = document.getElementById('adminUserList');
  if(!list) return;
  var filtered = usuarios.filter(function(u) {
    return (u.nome || '').toLowerCase().includes(query) || 
           (u.telefone || '').includes(query) || 
           (u.uid || '').toLowerCase().includes(query);
  });
  if(filtered.length === 0) { 
    list.innerHTML = '<p style="font-size:11px;color:var(--texto-mut);">Nenhum utilizador encontrado.</p>'; 
    return; 
  }
  var h = '';
  filtered.forEach(function(u) { h += renderUserAdminCard(u); });
  list.innerHTML = h;
}

      <b style="color:var(--dourado);">Planos Ativos:</b><br>

      </div>
      <button onclick="adminRedefinirSenha('${u.uid}')" style="padding:10px; background:var(--dourado); color:#000; border:none; border-radius:8px; font-weight:800; cursor:pointer;">Redefinir Senha</button>
    </div>
  `;

function adminAjustarSaldo(uid, operacao) {
  var valorStr = document.getElementById('adj_saldo_val').value;
  var valor = parseFloat(valorStr);
  if(isNaN(valor) || valor <= 0) { alert('Digite um valor válido.'); return; }
  
  var u = usuarios.find(function(x){ return x.uid === uid; });
  if(!u) return;

  var novoSaldo = u.saldoKz || 0;
  if(operacao === '+') novoSaldo += valor;
  else if(operacao === '-') novoSaldo -= valor;
  
  if(novoSaldo < 0) { alert('O saldo não pode ficar negativo.'); return; }

  if(!confirm('Confirmar ' + (operacao === '+' ? 'adição' : 'remoção') + ' de ' + formatKz(valor) + '?\nNovo saldo: ' + formatKz(novoSaldo))) return;

  db.collection('usuarios').doc(uid).update({ saldoKz: novoSaldo }).then(function(){
    alert('✅ Saldo ajustado com sucesso!');
    fecharModal();
    carregarTudo(function(){ adminTab('usuarios'); });
  });
}

function adminEliminarContaUsuario(uid, index) {
  if(!confirm('Deseja eliminar esta conta vinculada? O utilizador poderá vincular uma nova.')) return;
  var u = usuarios.find(function(x){ return x.uid === uid; });
  var contas = u.contasLevantamento || [];
  contas.splice(index, 1);
  db.collection('usuarios').doc(uid).update({ contasLevantamento: contas }).then(function(){
    alert('✅ Conta eliminada.');
    fecharModal();
    carregarTudo(function(){ adminTab('usuarios'); });
  });
}

function adminEliminarPlanoEspecifico(uid, index) {
  if(!confirm('Deseja eliminar este plano?')) return;
  var u = usuarios.find(function(x){ return x.uid === uid; });
  var planos = u.planosAtivos || [];
  planos.splice(index, 1);
  db.collection('usuarios').doc(uid).update({ planosAtivos: planos }).then(function(){
    alert('✅ Plano eliminado.');
    fecharModal();
    carregarTudo(function(){ adminTab('usuarios'); });
  });
}

function adminRedefinirSenha(uid) {
  var novaSenha = prompt('Digite a nova senha (6 dígitos):');
  if(!novaSenha || novaSenha.length !== 6) { alert('A senha deve ter 6 dígitos.'); return; }
  db.collection('usuarios').doc(uid).update({ senhaVisivel: novaSenha }).then(function(){
    alert('✅ Senha redefinida no banco de dados!');
    fecharModal();
    adminTab('usuarios');
  });
}

function adminToggleBlock(uid) {
  var u = usuarios.find(function(x){ return x.uid === uid; });
  if(!u) return;
  var novoEstado = !u.bloqueado;
  db.collection('usuarios').doc(uid).update({ bloqueado: novoEstado, tentativasLogin: 0 }).then(function(){
    alert(novoEstado ? '🔒 Utilizador bloqueado.' : '🔓 Utilizador desbloqueado.');
    carregarTudo(function(){ adminTab('usuarios'); });
  });
}

function adminEliminarUsuario(uid) {
  if(!confirm('⚠️ TEM A CERTEZA? O utilizador será eliminado permanentemente.')) return;
  db.collection('usuarios').doc(uid).delete().then(function(){
    alert('✅ Utilizador eliminado.');
    carregarTudo(function(){ adminTab('usuarios'); });
  });
}

/* ===== ADMIN: CREDITAR RENDAS ===== */
function adminCreditarTodos(isAuto) {
  if(!isAuto && !confirm('Deseja creditar as rendas de 7.5% para todos os utilizadores com planos ativos?')) return;
  var promessas = [];
  var countUsers = 0;
  var totalKz = 0;

  usuarios.forEach(function(u) {
    var planos = u.planosAtivos || [];
    if(planos.length === 0) return;
    var totalCredito = 0; var alterou = false;
    planos.forEach(function(p) {
      var ultimo = p.ultimoCredito || p.dataInicio_timestamp || (Date.now() - 24*60*60*1000);
      var dias = Math.floor((Date.now() - ultimo) / (24*60*60*1000));
      if(dias > 0) {
        totalCredito += p.diario * dias;
        p.ganhoTotal = (p.ganhoTotal || 0) + (p.diario * dias);
        p.ultimoCredito = Date.now();
        alterou = true;
      }
    });
    if(alterou) {
      countUsers++;
      totalKz += totalCredito;
      var novoSaldo = (u.saldoKz || 0) + totalCredito;
      promessas.push(db.collection('usuarios').doc(u.uid).update({ saldoKz: novoSaldo, ganhosHojeKz: (u.ganhosHojeKz || 0) + totalCredito, planosAtivos: planos }));
    }
  });
  
  Promise.all(promessas).then(function() {
    if(!isAuto) {
      var el = document.getElementById('adminCreditResult');
      if(el) el.innerHTML = `✅ Rendas creditadas com sucesso!<br><b>${countUsers}</b> utilizadores abrangidos.<br>Total: <b>${formatKz(totalKz)}</b>`;
      alert('✅ Rendas creditadas com sucesso!\nUtilizadores abrangidos: ' + countUsers + '\nTotal: ' + formatKz(totalKz));
    }
    carregarTudo(function(){ if(!isAuto) adminTab('creditar'); });
  });
}

/* ===== ADMIN: ENVIAR NOTIFICAÇÃO ===== */
function enviarNotificacaoAdmin() {
  var dest = document.getElementById('notif_dest').value;
  var msg = document.getElementById('notif_msg').value.trim();
  if(!msg) { alert('Escreva a mensagem.'); return; }

  if(dest === 'todos') {
    if(!confirm('Enviar para TODOS os utilizadores?')) return;
    var promises = usuarios.map(function(u){
      return db.collection('usuarios').doc(u.uid).update({ notificacaoAdmin: msg });
    });
    Promise.all(promises).then(function(){
      alert('✅ Mensagem enviada para todos!');
      document.getElementById('notif_msg').value = '';
    });
  } else {
    if(!confirm('Enviar esta mensagem?')) return;
    db.collection('usuarios').doc(dest).update({ notificacaoAdmin: msg }).then(function(){
      alert('✅ Mensagem enviada!');
      document.getElementById('notif_msg').value = '';
    });
  }
}

        <div class="form-group"><label>Unitel Referência</label><input type="text" id="cfg_unitelRef" value="${d.unitelRef}" style="background:#000;border:1px solid var(--dourado);color:#FFF;padding:10px;width:100%;border-radius:8px;"></div>
        <div class="form-group"><label>PayPay Entidade</label><input type="text" id="cfg_paypayEnt" value="${d.paypayEnt}" style="background:#000;border:1px solid var(--dourado);color:#FFF;padding:10px;width:100%;border-radius:8px;"></div>

        </div>

function adminGuardarConfig() {
  CONFIG.minDeposito = parseFloat(document.getElementById('cfg_minDep').value);
  CONFIG.minSaque = parseFloat(document.getElementById('cfg_minSaq').value);
  CONFIG.taxaSaque = parseFloat(document.getElementById('cfg_taxa').value) / 100;
  CONFIG.horarioDeposito = document.getElementById('cfg_horarioDep').value;
  CONFIG.horarioSaque = document.getElementById('cfg_horarioSaq').value;
  CONFIG.dadosDeposito.iban = document.getElementById('cfg_iban').value;
  CONFIG.dadosDeposito.titular = document.getElementById('cfg_titular').value;
  CONFIG.dadosDeposito.unitelEnt = document.getElementById('cfg_unitelEnt').value;
  CONFIG.dadosDeposito.unitelRef = document.getElementById('cfg_unitelRef').value;
  CONFIG.dadosDeposito.paypayEnt = document.getElementById('cfg_paypayEnt').value;
  CONFIG.dadosDeposito.paypayRef = document.getElementById('cfg_paypayRef').value;
  
  var novoLink = document.getElementById('cfg_linkWhatsApp').value.trim();
  SUPORTE_1 = document.getElementById('cfg_suporte1').value;
  SUPORTE_2 = document.getElementById('cfg_suporte2').value;

  localStorage.setItem('yumi_config', JSON.stringify(CONFIG));
  localStorage.setItem('yumi_suporte1', SUPORTE_1);
  localStorage.setItem('yumi_suporte2', SUPORTE_2);

  if(novoLink) {
    db.collection('configuracoes').doc('global').set({ whatsapp: novoLink }, { merge: true }).then(function(){
      LINK_GRUPO_WHATSAPP = novoLink;
      alert('✅ Configurações guardadas! O link do WhatsApp foi atualizado globalmente para todos os utilizadores.');
      mudarTab('inicio');
    }).catch(function(err){
      console.error(err);
      alert('Erro ao guardar o link no servidor. Tente novamente.');
    });
  } else {
    alert('✅ Configurações guardadas!');
    mudarTab('inicio');
  }
}

/* ===== RENDAS AUTOMÁTICAS ===== */
function verificarHoraCredito() {
  var agora = new Date();
  var hora = agora.getHours();
  var hojeStr = agora.toLocaleDateString('pt-BR');
  var ultimaExecucao = localStorage.getItem('yumi_ultima_renda_auto');

  if (hora >= 4 && ultimaExecucao !== hojeStr) {
    console.log('⏰ A iniciar crédito automático de rendas...');
    adminCreditarTodos(true);
    localStorage.setItem('yumi_ultima_renda_auto', hojeStr);
  }
}
setInterval(verificarHoraCredito, 60000);
setTimeout(verificarHoraCredito, 5000);

setTimeout(function(){
  var loading = document.getElementById('telaLoading');
  if(loading) loading.style.display = 'none';
}, 2000);
</script>
